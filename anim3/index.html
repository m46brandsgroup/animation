<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FadeContent</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="fade-content.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #080b11;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 250vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .scroll-guide {
      height: 175vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      user-select: none;
    }

    .scroll-arrow {
      width: 12px;
      height: 12px;
      border-right: 2px solid #64748b;
      border-bottom: 2px solid #64748b;
      transform: rotate(45deg);
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(45deg); opacity: 0.3; }
      50% { transform: translateY(8px) rotate(45deg); opacity: 0.9; }
    }

    .fade-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 24px;
      text-align: center;
    }

    [data-fade-content] h2 {
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 16px;
      color: #ffffff;
    }

    [data-fade-content] p {
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      color: #94a3b8;
      line-height: 1.6;
    }

    .bottom-spacer {
      height: 175vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="scroll-guide">
    <span>Scroll down to reveal</span>
    <div class="scroll-arrow"></div>
  </div>

  <main class="fade-container">
    <div data-fade-content
         data-effect="mist"
         data-duration="1.8"
         data-ease="power2.out"
         data-stagger="0.1"
         data-threshold="0.1">
      <h2>Slow light over the bay</h2>
      <p>Every child fades in turn.</p>
    </div>
  </main>

  <div class="bottom-spacer">
    <span>Scroll up to reverse</span>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="fade-content.js"></script>
</body>
</html>
